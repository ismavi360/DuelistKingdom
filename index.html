<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Se deshabilita el zoom mediante gestos en dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DUELIST KINGDOM TCG</title>
    <style>
        /* ==========================================================================
           VARIABLES Y CONFIGURACIÓN GENERAL
           ========================================================================== */
        :root {
            --bg-dark: #0a0a12;
            --gold-yugioh: #ffcc00;
            --gold-glow: #ff8800;
            --blue-pokemon: #00d2ff;
            --blue-glow: #3a7bd5;
            --text-light: #f5f5f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            touch-action: manipulation;
        }

        /* Bloquea scroll global en toda la ventana */
        html, body {
            width: 100%;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden; 
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Fondo radial dinámico */
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, #1a102f 0%, #050508 100%);
            z-index: -1;
        }

        .container {
            width: 92%;
            max-width: 1150px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* ==========================================================================
           ENCABEZADO Y EFECTOS DEL TÍTULO
           ========================================================================== */
        .hero-header {
            margin-bottom: clamp(10px, 3vh, 25px);
            text-align: center;
        }

        .sub-title {
            font-size: clamp(0.75rem, 1.8vh, 1rem);
            letter-spacing: 4px;
            color: #8888aa;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .main-title {
            font-size: clamp(2rem, 5.5vh, 4rem);
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #d4af37 60%, #aa7c11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            letter-spacing: 2px;
            animation: pulseGlow 3s infinite alternate ease-in-out;
            line-height: 1.1;
        }

        .store-tag {
            font-size: clamp(0.65rem, 1.4vh, 0.85rem);
            letter-spacing: 4px;
            color: #cccccc;
            margin-top: 4px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* ==========================================================================
           SECCIÓN DE PORTALES (BOTONES ORGANIZADOS Y MÁS GRANDES)
           ========================================================================== */
        .portal-selection {
            display: grid;
            width: 100%;
            gap: clamp(12px, 2.5vh, 25px);
            justify-content: center;
            align-items: center;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        /* Orientación en Celular Vertical: Uno sobre otro */
        @media (max-width: 767px) and (orientation: portrait) {
            .portal-selection {
                grid-template-columns: 1fr;
            }
        }

        .portal-card {
            text-decoration: none;
            color: inherit;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: clamp(18px, 3.5vh, 32px) clamp(15px, 2.5vw, 25px);
            border: 2px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
        }

        .portal-content {
            position: relative;
            z-index: 2;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: clamp(0.7rem, 1.3vh, 0.8rem);
            font-weight: 700;
            margin-bottom: clamp(6px, 1.2vh, 12px);
            background: rgba(255, 255, 255, 0.12);
            letter-spacing: 1px;
        }

        .portal-card h2 {
            font-size: clamp(1.1rem, 2.3vh, 1.4rem);
            letter-spacing: 1px;
            font-weight: 700;
        }

        .portal-card h3 {
            font-size: clamp(1.8rem, 4.2vh, 2.6rem);
            margin-bottom: clamp(6px, 1.2vh, 12px);
            font-weight: 900;
            line-height: 1.1;
        }

        .portal-card p {
            font-size: clamp(0.85rem, 1.8vh, 1.05rem);
            color: #aaaaee;
            margin-bottom: clamp(14px, 2.5vh, 24px);
            line-height: 1.3;
        }

        /* Botón de acción principal agrandado */
        .btn-action {
            display: block;
            padding: clamp(12px, 2vh, 16px) 20px;
            border-radius: 10px;
            font-weight: 900;
            font-size: clamp(0.85rem, 1.9vh, 1.05rem);
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
        }

        /* ==========================================================================
           TEMÁTICA YU-GI-OH!
           ========================================================================== */
        .yugioh-portal {
            border-color: rgba(255, 204, 0, 0.4);
        }

        .yugioh-portal h3 {
            color: var(--gold-yugioh);
            text-shadow: 0 0 12px rgba(255, 204, 0, 0.5);
        }

        .yugioh-portal .btn-action {
            background: rgba(255, 204, 0, 0.1);
            border: 2px solid var(--gold-yugioh);
            color: var(--gold-yugioh);
        }

        .yugioh-portal:hover {
            transform: translateY(-4px) scale(1.015);
            border-color: var(--gold-yugioh);
            box-shadow: 0 10px 30px rgba(255, 136, 0, 0.4);
        }

        .yugioh-portal:hover .btn-action {
            background: var(--gold-yugioh);
            color: #000000;
            box-shadow: 0 0 20px var(--gold-yugioh);
        }

        /* ==========================================================================
           TEMÁTICA POKÉMON
           ========================================================================== */
        .pokemon-portal {
            border-color: rgba(0, 210, 255, 0.4);
        }

        .pokemon-portal h3 {
            color: var(--blue-pokemon);
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
        }

        .pokemon-portal .btn-action {
            background: rgba(0, 210, 255, 0.1);
            border: 2px solid var(--blue-pokemon);
            color: var(--blue-pokemon);
        }

        .pokemon-portal:hover {
            transform: translateY(-4px) scale(1.015);
            border-color: var(--blue-pokemon);
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.4);
        }

        .pokemon-portal:hover .btn-action {
            background: var(--blue-pokemon);
            color: #000000;
            box-shadow: 0 0 20px var(--blue-pokemon);
        }

        /* Animación del Título Principal */
        @keyframes pulseGlow {
            0% {
                filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
            }
            100% {
                filter: drop-shadow(0 0 25px rgba(255, 204, 0, 0.7));
            }
        }
    </style>
</head>
<body>
    <div class="background-overlay"></div>
    
    <main class="container">
        <!-- Encabezado Principal -->
        <header class="hero-header">
            <h2 class="sub-title">BIENVENIDO A</h2>
            <h1 class="main-title">DUELIST KINGDOM</h1>
            <p class="store-tag">TCG STORE &amp; TOURNAMENT CENTER</p>
        </header>

        <!-- Selección de Sección -->
        <section class="portal-selection">
            <!-- Botón Yu-Gi-Oh! -->
            <a href="masterLigaDK.html" class="portal-card yugioh-portal">
                <div class="portal-content">
                    <span class="badge">TCG</span>
                    <h2>MASTER LIGA</h2>
                    <h3>Yu-Gi-Oh!</h3>
                    <p>Clasificación, mazos meta y torneos semanales</p>
                    <span class="btn-action">ENTRAR AL DUELO</span>
                </div>
            </a>

            <!-- Botón Pokémon -->
            <a href="seriesPokemon.html" class="portal-card pokemon-portal">
                <div class="portal-content">
                    <span class="badge">TCG</span>
                    <h2>SERIES</h2>
                    <h3>POKÉMON</h3>
                    <p>Tabla de posiciones, liga local y resultados</p>
                    <span class="btn-action">INICIAR AVENTURA</span>
                </div>
            </a>
        </section>
    </main>
</body>
</html>
